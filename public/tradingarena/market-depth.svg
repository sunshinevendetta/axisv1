    </g>
    <g stroke="#fff" filter="url(#whiteGlow)">
      <path d="M296 476 V625"/>
      <rect x="273" y="508" width="46" height="84" fill="#222" stroke="#fff" stroke-width="5" rx="3"/>
      <path d="M552 390 V565"/>
      <rect x="529" y="420" width="46" height="104" fill="#222" stroke="#fff" stroke-width="5" rx="3"/>
      <path d="M680 332 V530"/>
