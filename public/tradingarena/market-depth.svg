<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Monochrome trading bars visual">
  <defs>
    <filter id="whiteGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .depth-bars rect {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: depthTick 2.8s ease-in-out infinite;
    }
    .depth-bars rect:nth-child(3n) { animation-duration: 2.1s; }
    .depth-bars rect:nth-child(4n) { animation-duration: 3.4s; }
    .depth-bars rect:nth-child(5n) { animation-delay: -.8s; }
    .depth-bars rect:nth-child(7n) { animation-delay: -1.3s; }
    .candles rect {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: candleBody 2.6s ease-in-out infinite;
    }
    .candles path {
      transform-box: fill-box;
      transform-origin: center center;
      animation: candleWick 2.6s ease-in-out infinite;
    }
    .candles rect:nth-of-type(2n), .candles path:nth-of-type(2n) { animation-delay: -.55s; }
    .candles rect:nth-of-type(3n), .candles path:nth-of-type(3n) { animation-delay: -1.1s; }
    .price-trace {
      stroke-dasharray: 1440;
      stroke-dashoffset: 1440;
      animation: traceLive 3.2s ease-in-out infinite;
    }
    @keyframes depthTick {
      0%, 100% { transform: scaleY(.72); opacity: .55; }
      33% { transform: scaleY(1.08); opacity: .95; }
      66% { transform: scaleY(.86); opacity: .72; }
    }
    @keyframes candleBody {
      0%, 100% { transform: translateY(0) scaleY(.82); opacity: .84; }
      45% { transform: translateY(-18px) scaleY(1.18); opacity: 1; }
      72% { transform: translateY(8px) scaleY(.92); opacity: .9; }
    }
    @keyframes candleWick {
      0%, 100% { transform: scaleY(.8); opacity: .7; }
      45% { transform: scaleY(1.22); opacity: 1; }
      72% { transform: scaleY(.96); opacity: .82; }
    }
    @keyframes traceLive {
      0% { stroke-dashoffset: 1440; opacity: .18; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -1440; opacity: .28; }
    }
    @media (prefers-reduced-motion: reduce) {
      .depth-bars rect, .candles rect, .candles path, .price-trace { animation: none; }
    }
  </style>

  <rect width="1600" height="1000" fill="#030303"/>

  <g opacity=".16" stroke="#fff" stroke-width="1">
    <path d="M0 180 H1600M0 320 H1600M0 460 H1600M0 600 H1600M0 740 H1600M0 880 H1600"/>
    <path d="M120 0 V1000M260 0 V1000M400 0 V1000M540 0 V1000M680 0 V1000M820 0 V1000M960 0 V1000M1100 0 V1000M1240 0 V1000M1380 0 V1000M1520 0 V1000"/>
  </g>

  <g opacity=".28" fill="none" stroke-width="2">
    <path d="M88 790 C250 680 330 720 460 610 S720 455 870 520 1100 620 1238 470 1400 300 1515 250" stroke="#fff"/>
    <path d="M90 260 C220 340 315 300 430 365 S690 515 840 430 1040 260 1185 320 1390 470 1515 390" stroke="#aaa"/>
    <path d="M110 875 C330 790 500 835 680 720 S1030 650 1220 500 1415 360 1510 320" stroke="#ddd"/>
  </g>

  <g class="depth-bars" opacity=".78">
    <rect x="118" y="715" width="32" height="108" rx="4" fill="#777"/>
    <rect x="172" y="680" width="32" height="143" rx="4" fill="#eee"/>
    <rect x="226" y="640" width="32" height="183" rx="4" fill="#bbb"/>
    <rect x="280" y="690" width="32" height="133" rx="4" fill="#888"/>
    <rect x="334" y="610" width="32" height="213" rx="4" fill="#ddd"/>
    <rect x="388" y="575" width="32" height="248" rx="4" fill="#aaa"/>
    <rect x="442" y="525" width="32" height="298" rx="4" fill="#f4f4f4"/>
    <rect x="496" y="600" width="32" height="223" rx="4" fill="#8f8f8f"/>
    <rect x="550" y="485" width="32" height="338" rx="4" fill="#cfcfcf"/>
    <rect x="604" y="440" width="32" height="383" rx="4" fill="#f7f7f7"/>
    <rect x="658" y="505" width="32" height="318" rx="4" fill="#9a9a9a"/>
    <rect x="712" y="395" width="32" height="428" rx="4" fill="#d8d8d8"/>
    <rect x="766" y="350" width="32" height="473" rx="4" fill="#fff"/>
    <rect x="820" y="420" width="32" height="403" rx="4" fill="#8a8a8a"/>
    <rect x="874" y="300" width="32" height="523" rx="4" fill="#d0d0d0"/>
    <rect x="928" y="335" width="32" height="488" rx="4" fill="#f0f0f0"/>
    <rect x="982" y="260" width="32" height="563" rx="4" fill="#bdbdbd"/>
    <rect x="1036" y="380" width="32" height="443" rx="4" fill="#868686"/>
    <rect x="1090" y="312" width="32" height="511" rx="4" fill="#dcdcdc"/>
    <rect x="1144" y="230" width="32" height="593" rx="4" fill="#fafafa"/>
    <rect x="1198" y="280" width="32" height="543" rx="4" fill="#999"/>
    <rect x="1252" y="198" width="32" height="625" rx="4" fill="#e4e4e4"/>
    <rect x="1306" y="245" width="32" height="578" rx="4" fill="#b7b7b7"/>
    <rect x="1360" y="170" width="32" height="653" rx="4" fill="#fff"/>
    <rect x="1414" y="118" width="32" height="705" rx="4" fill="#d6d6d6"/>
  </g>

  <g class="candles" stroke-width="7">
    <g stroke="#aaa" filter="url(#softGlow)">
