      <path d="M1448 96 V315"/>
      <rect x="1425" y="132" width="46" height="126" fill="#222" stroke="#fff" stroke-width="5" rx="3"/>
    </g>
  </g>

  <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#whiteGlow)">
    <path class="price-trace" d="M116 690 L220 620 L318 645 L430 530 L548 566 L662 430 L780 464 L918 305 L1048 372 L1186 242 L1320 282 L1480 116"/>
  </g>

</svg>
