          <circle class="agent-dot" cx="0" cy="0" r="8" fill="#ff233f" stroke="none"/>
        </g>
      </g>
      <g class="category-card agent-card" transform="translate(1034 344)" fill="none" stroke="#fff" stroke-width="4">
        <rect x="-22" y="-22" width="44" height="44" rx="7"/>
        <path d="M-36 -12H-22M-36 0H-22M-36 12H-22M22 -12H36M22 0H36M22 12H36M-12 -36V-22M0 -36V-22M12 -36V-22M-12 22V36M0 22V36M12 22V36"/>
        <g class="agent-core">
          <circle class="agent-halo" cx="0" cy="0" r="16" fill="#ff233f" opacity=".18" stroke="none"/>
          <circle class="agent-dot" cx="0" cy="0" r="8" fill="#ff233f" stroke="none"/>
        </g>
      </g>
      <g class="category-card agent-card" transform="translate(1034 504)" fill="none" stroke="#fff" stroke-width="4">
        <rect x="-22" y="-22" width="44" height="44" rx="7"/>
        <path d="M-36 -12H-22M-36 0H-22M-36 12H-22M22 -12H36M22 0H36M22 12H36M-12 -36V-22M0 -36V-22M12 -36V-22M-12 22V36M0 22V36M12 22V36"/>
        <g class="agent-core">
          <circle class="agent-halo" cx="0" cy="0" r="16" fill="#ff233f" opacity=".18" stroke="none"/>
          <circle class="agent-dot" cx="0" cy="0" r="8" fill="#ff233f" stroke="none"/>
        </g>
      </g>
      <g class="category-card agent-card" transform="translate(1034 624)" fill="none" stroke="#fff" stroke-width="4">
        <rect x="-22" y="-22" width="44" height="44" rx="7"/>
        <path d="M-36 -12H-22M-36 0H-22M-36 12H-22M22 -12H36M22 0H36M22 12H36M-12 -36V-22M0 -36V-22M12 -36V-22M-12 22V36M0 22V36M12 22V36"/>
        <g class="agent-core">
          <circle class="agent-halo" cx="0" cy="0" r="16" fill="#ff233f" opacity=".18" stroke="none"/>
          <circle class="agent-dot" cx="0" cy="0" r="8" fill="#ff233f" stroke="none"/>
        </g>
      </g>
    </g>
