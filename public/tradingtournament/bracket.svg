  <g class="center-panel" font-family="Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <path d="M600 280L718 400L600 520L482 400Z" fill="#080808" stroke="#fff" stroke-width="4"/>
    <text x="600" y="370" fill="#fff" font-size="40">2 CATEGORIAS</text>
    <text x="600" y="430" fill="#f6d878" font-size="25">PROFIT WINS</text>
    <text x="600" y="464" fill="#aaa" font-size="18">ELIMINACION POR LIQUIDACION</text>
  </g>

</svg>
