<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Futuristic colored trading bars visual">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset=".48" stop-color="#060817"/>
      <stop offset="1" stop-color="#010308"/>
    </linearGradient>
    <linearGradient id="depthGreen" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00ff95" stop-opacity=".08"/>
      <stop offset=".62" stop-color="#00ff95" stop-opacity=".56"/>
      <stop offset="1" stop-color="#b8ffe2" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="depthCyan" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00ccff" stop-opacity=".08"/>
      <stop offset=".62" stop-color="#00ccff" stop-opacity=".48"/>
      <stop offset="1" stop-color="#d8f8ff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="depthMagenta" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b56cff" stop-opacity=".08"/>
      <stop offset=".62" stop-color="#b56cff" stop-opacity=".44"/>
      <stop offset="1" stop-color="#f4dcff" stop-opacity=".88"/>
    </linearGradient>
    <filter id="greenGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .depth-bars rect {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: depthTick 2.8s ease-in-out infinite;
    }
    .depth-bars rect:nth-child(3n) { animation-duration: 2.1s; }
    .depth-bars rect:nth-child(4n) { animation-duration: 3.4s; }
    .depth-bars rect:nth-child(5n) { animation-delay: -.8s; }
    .depth-bars rect:nth-child(7n) { animation-delay: -1.3s; }
    .candles rect {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: candleBody 2.6s ease-in-out infinite;
    }
    .candles path {
      transform-box: fill-box;
      transform-origin: center center;
      animation: candleWick 2.6s ease-in-out infinite;
    }
    .candles rect:nth-of-type(2n), .candles path:nth-of-type(2n) { animation-delay: -.55s; }
    .candles rect:nth-of-type(3n), .candles path:nth-of-type(3n) { animation-delay: -1.1s; }
    .price-trace {
      stroke-dasharray: 1440;
      stroke-dashoffset: 1440;
      animation: traceLive 3.2s ease-in-out infinite;
    }
    @keyframes depthTick {
      0%, 100% { transform: scaleY(.72); opacity: .55; }
      33% { transform: scaleY(1.08); opacity: .95; }
      66% { transform: scaleY(.86); opacity: .72; }
    }
    @keyframes candleBody {
      0%, 100% { transform: translateY(0) scaleY(.82); opacity: .84; }
      45% { transform: translateY(-18px) scaleY(1.18); opacity: 1; }
      72% { transform: translateY(8px) scaleY(.92); opacity: .9; }
    }
    @keyframes candleWick {
      0%, 100% { transform: scaleY(.8); opacity: .7; }
      45% { transform: scaleY(1.22); opacity: 1; }
      72% { transform: scaleY(.96); opacity: .82; }
    }
    @keyframes traceLive {
      0% { stroke-dashoffset: 1440; opacity: .18; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -1440; opacity: .28; }
    }
    @media (prefers-reduced-motion: reduce) {
      .depth-bars rect, .candles rect, .candles path, .price-trace { animation: none; }
    }
  </style>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <g opacity=".16" stroke="#7df7ff" stroke-width="1">
    <path d="M0 180 H1600M0 320 H1600M0 460 H1600M0 600 H1600M0 740 H1600M0 880 H1600"/>
    <path d="M120 0 V1000M260 0 V1000M400 0 V1000M540 0 V1000M680 0 V1000M820 0 V1000M960 0 V1000M1100 0 V1000M1240 0 V1000M1380 0 V1000M1520 0 V1000"/>
  </g>

  <g opacity=".28" fill="none" stroke-width="2">
    <path d="M88 790 C250 680 330 720 460 610 S720 455 870 520 1100 620 1238 470 1400 300 1515 250" stroke="#00ff95"/>
    <path d="M90 260 C220 340 315 300 430 365 S690 515 840 430 1040 260 1185 320 1390 470 1515 390" stroke="#ff3158"/>
    <path d="M110 875 C330 790 500 835 680 720 S1030 650 1220 500 1415 360 1510 320" stroke="#00ccff"/>
  </g>

  <g class="depth-bars" opacity=".78">
    <rect x="118" y="715" width="32" height="108" rx="4" fill="url(#depthCyan)"/>
    <rect x="172" y="680" width="32" height="143" rx="4" fill="url(#depthGreen)"/>
    <rect x="226" y="640" width="32" height="183" rx="4" fill="url(#depthGreen)"/>
    <rect x="280" y="690" width="32" height="133" rx="4" fill="url(#depthMagenta)"/>
    <rect x="334" y="610" width="32" height="213" rx="4" fill="url(#depthCyan)"/>
    <rect x="388" y="575" width="32" height="248" rx="4" fill="url(#depthGreen)"/>
    <rect x="442" y="525" width="32" height="298" rx="4" fill="url(#depthGreen)"/>
    <rect x="496" y="600" width="32" height="223" rx="4" fill="url(#depthMagenta)"/>
    <rect x="550" y="485" width="32" height="338" rx="4" fill="url(#depthCyan)"/>
    <rect x="604" y="440" width="32" height="383" rx="4" fill="url(#depthGreen)"/>
    <rect x="658" y="505" width="32" height="318" rx="4" fill="url(#depthMagenta)"/>
    <rect x="712" y="395" width="32" height="428" rx="4" fill="url(#depthCyan)"/>
    <rect x="766" y="350" width="32" height="473" rx="4" fill="url(#depthGreen)"/>
    <rect x="820" y="420" width="32" height="403" rx="4" fill="url(#depthMagenta)"/>
    <rect x="874" y="300" width="32" height="523" rx="4" fill="url(#depthCyan)"/>
    <rect x="928" y="335" width="32" height="488" rx="4" fill="url(#depthGreen)"/>
    <rect x="982" y="260" width="32" height="563" rx="4" fill="url(#depthGreen)"/>
    <rect x="1036" y="380" width="32" height="443" rx="4" fill="url(#depthMagenta)"/>
    <rect x="1090" y="312" width="32" height="511" rx="4" fill="url(#depthCyan)"/>
    <rect x="1144" y="230" width="32" height="593" rx="4" fill="url(#depthGreen)"/>
    <rect x="1198" y="280" width="32" height="543" rx="4" fill="url(#depthMagenta)"/>
    <rect x="1252" y="198" width="32" height="625" rx="4" fill="url(#depthCyan)"/>
    <rect x="1306" y="245" width="32" height="578" rx="4" fill="url(#depthGreen)"/>
    <rect x="1360" y="170" width="32" height="653" rx="4" fill="url(#depthGreen)"/>
    <rect x="1414" y="118" width="32" height="705" rx="4" fill="url(#depthCyan)"/>
  </g>

  <g class="candles" stroke-width="7">
    <g stroke="#ff3158" filter="url(#redGlow)">
      <path d="M168 568 V700"/>
      <rect x="145" y="600" width="46" height="72" fill="#25040a" stroke="#ff3158" stroke-width="5" rx="3"/>
      <path d="M424 534 V710"/>
      <rect x="401" y="558" width="46" height="96" fill="#25040a" stroke="#ff3158" stroke-width="5" rx="3"/>
      <path d="M808 410 V625"/>
      <rect x="785" y="452" width="46" height="110" fill="#25040a" stroke="#ff3158" stroke-width="5" rx="3"/>
      <path d="M1064 302 V528"/>
      <rect x="1041" y="346" width="46" height="116" fill="#25040a" stroke="#ff3158" stroke-width="5" rx="3"/>
    </g>
    <g stroke="#00ff95" filter="url(#greenGlow)">
      <path d="M296 476 V625"/>
      <rect x="273" y="508" width="46" height="84" fill="#052719" stroke="#00ff95" stroke-width="5" rx="3"/>
      <path d="M552 390 V565"/>
      <rect x="529" y="420" width="46" height="104" fill="#052719" stroke="#00ff95" stroke-width="5" rx="3"/>
      <path d="M680 332 V530"/>
      <rect x="657" y="365" width="46" height="118" fill="#052719" stroke="#00ff95" stroke-width="5" rx="3"/>
      <path d="M936 250 V455"/>
      <rect x="913" y="282" width="46" height="122" fill="#052719" stroke="#00ff95" stroke-width="5" rx="3"/>
      <path d="M1192 190 V430"/>
      <rect x="1169" y="225" width="46" height="140" fill="#052719" stroke="#00ff95" stroke-width="5" rx="3"/>
      <path d="M1320 150 V368"/>
      <rect x="1297" y="185" width="46" height="130" fill="#052719" stroke="#00ff95" stroke-width="5" rx="3"/>
      <path d="M1448 96 V315"/>
      <rect x="1425" y="132" width="46" height="126" fill="#052719" stroke="#00ff95" stroke-width="5" rx="3"/>
    </g>
  </g>

  <g fill="none" stroke="#00ff95" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#greenGlow)">
    <path class="price-trace" d="M116 690 L220 620 L318 645 L430 530 L548 566 L662 430 L780 464 L918 305 L1048 372 L1186 242 L1320 282 L1480 116"/>
  </g>

</svg>
